<div class="flex justify-center wrapper">
  <p-drawer [(visible)]="createTruck" header="Truck Details">
    <div class="flex forms-wrapper">
      <p-floatlabel>
        <input type="number" pInputText id="truck_width" [(ngModel)]="truckDimensions.width" />
        <label for="truck_width">Truck Width (mm)</label>
      </p-floatlabel>
      <p-floatlabel>
        <input type="number" pInputText id="truck_length" [(ngModel)]="truckDimensions.length" />
        <label for="truck_length">Truck length (mm)</label>
      </p-floatlabel>
      <p-floatlabel>
        <input type="number" pInputText id="truck_height" [(ngModel)]="truckDimensions.height" />
        <label for="truck_height">Truck Height (mm)</label>
      </p-floatlabel>
      <div class="flex justify-center mt-3">
        <p-button (click)="updateTruck()" label="Update Truck" icon="pi pi-refresh" />
      </div>
    </div>
  </p-drawer>
  <p-button (click)="createTruck = true" icon="pi pi-truck" />

  <p-drawer [(visible)]="visible" header="Container Details">
    <div class="flex forms-wrapper">
      <p-floatlabel>
        <input type="number" pInputText id="container_width" [(ngModel)]="containerDetails.width" />
        <label for="container_width">Container Width (mm)</label>
      </p-floatlabel>
      <p-floatlabel>
        <input type="number" pInputText id="container_length" [(ngModel)]="containerDetails.length" />
        <label for="container_length">Container length (mm)</label>
      </p-floatlabel>
      <p-floatlabel>
        <input type="number" pInputText id="container_height" [(ngModel)]="containerDetails.height" />
        <label for="container_height">Container Height (mm)</label>
      </p-floatlabel>
      <p-floatlabel>
        <input type="number" pInputText id="container_weight" [(ngModel)]="containerDetails.weight" />
        <label for="container_weight">Container Weight (g)</label>
      </p-floatlabel>
      <p-floatlabel>
        <input type="number" pInputText id="container_amount" [(ngModel)]="containerDetails.amount" />
        <label for="container_amount">Amount</label>
      </p-floatlabel>
      <div class="flex justify-center mt-3">
        <p-button (click)="addContainer()" label="Add Container" icon="pi pi-plus" />
      </div>
    </div>
  </p-drawer>
  <p-button (click)="visible = true" icon="pi pi-warehouse" />
</div>
