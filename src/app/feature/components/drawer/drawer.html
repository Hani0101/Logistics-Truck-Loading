<div class="drawer-triggers">

  <!-- Truck -->
  <p-button
    (click)="createTruck = true"
    icon="pi pi-truck"
    label="Truck"
    [outlined]="true"
    [fluid]="true">
  </p-button>

  <!-- Container -->
  <p-button
    (click)="visible = true"
    icon="pi pi-warehouse"
    label="Container"
    [outlined]="true"
    [fluid]="true">
  </p-button>

  <div class="section-divider"></div>

  <!-- Layout save / load -->
  <div class="layout-section">
    <p class="section-label">Layouts</p>

    @if (activeLayoutName) {
      <div class="active-layout">
        <i class="pi pi-check-circle"></i>
        <span class="active-layout-name" [title]="activeLayoutName">{{ activeLayoutName }}</span>
      </div>
    }

    <p-button
      (click)="openSaveDrawer()"
      icon="pi pi-save"
      label="Save Layout"
      [outlined]="true"
      [fluid]="true"
      severity="secondary">
    </p-button>

    <div class="load-row">
      <p-select
        [(ngModel)]="selectedLayoutId"
        [options]="savedLayouts"
        optionLabel="name"
        optionValue="id"
        placeholder="Select layout..."
        [fluid]="true"
        emptyMessage="No saved layouts"
        appendTo="body">
      </p-select>
      <p-button
        (click)="loadLayout()"
        icon="pi pi-upload"
        [loading]="isLoading"
        [disabled]="!selectedLayoutId">
      </p-button>
    </div>

    @if (selectedLayoutId && activeLayoutName) {
      <p-button
        (click)="deleteActiveLayout()"
        icon="pi pi-trash"
        label="Delete Layout"
        [outlined]="true"
        [fluid]="true"
        severity="danger">
      </p-button>
    }
  </div>
</div>

<!-- Truck Drawer -->
<p-drawer [(visible)]="createTruck" header="Truck Setup" position="left">
  <div class="form-fields">
    <p-floatlabel>
      <input type="number" pInputText id="truck_width" [(ngModel)]="truckDimensions.width" />
      <label for="truck_width">Width (mm)</label>
    </p-floatlabel>
    <p-floatlabel>
      <input type="number" pInputText id="truck_length" [(ngModel)]="truckDimensions.length" />
      <label for="truck_length">Length (mm)</label>
    </p-floatlabel>
    <p-floatlabel>
      <input type="number" pInputText id="truck_height" [(ngModel)]="truckDimensions.height" />
      <label for="truck_height">Height (mm)</label>
    </p-floatlabel>
  </div>
  <ng-template pTemplate="footer">
    <p-button (click)="updateTruck()" label="Update Truck" icon="pi pi-refresh" [fluid]="true" />
  </ng-template>
</p-drawer>

<!-- Container Drawer -->
<p-drawer [(visible)]="visible" header="Add Container" position="left">
  <div class="form-fields">
    <p-floatlabel>
      <input type="number" pInputText id="container_width" [(ngModel)]="containerDetails.width" />
      <label for="container_width">Width (mm)</label>
    </p-floatlabel>
    <p-floatlabel>
      <input type="number" pInputText id="container_length" [(ngModel)]="containerDetails.length" />
      <label for="container_length">Length (mm)</label>
    </p-floatlabel>
    <p-floatlabel>
      <input type="number" pInputText id="container_height" [(ngModel)]="containerDetails.height" />
      <label for="container_height">Height (mm)</label>
    </p-floatlabel>
    <p-floatlabel>
      <input type="number" pInputText id="container_weight" [(ngModel)]="containerDetails.weight" />
      <label for="container_weight">Weight (g)</label>
    </p-floatlabel>
    <p-floatlabel>
      <input type="number" pInputText id="container_amount" [(ngModel)]="containerDetails.amount" />
      <label for="container_amount">Amount</label>
    </p-floatlabel>
    <div class="color-field">
      <span class="color-label">Color</span>
      <div class="color-row">
        <p-colorpicker [(ngModel)]="containerDetails.color" format="hex"></p-colorpicker>
        <span class="color-hex">#{{ containerDetails.color }}</span>
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button (click)="addContainer()" label="Add Container" icon="pi pi-plus" [fluid]="true" />
  </ng-template>
</p-drawer>

<!-- Save Layout Drawer -->
<p-drawer [(visible)]="saveVisible" header="Save Layout" position="left">
  <div class="form-fields">
    <p-floatlabel>
      <input
        pInputText
        id="layout_name"
        [(ngModel)]="newLayoutName"
        (keyup.enter)="confirmSave()" />
      <label for="layout_name">Layout name</label>
    </p-floatlabel>
    @if (saveError) {
      <p class="save-error">{{ saveError }}</p>
    }
  </div>
  <ng-template pTemplate="footer">
    <p-button
      (click)="confirmSave()"
      label="Save"
      icon="pi pi-check"
      [fluid]="true"
      [loading]="isSaving" />
  </ng-template>
</p-drawer>
